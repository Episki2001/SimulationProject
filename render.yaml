services:
  - type: web
    name: simulation-project
    env: python
    runtime: python-3.14
    buildCommand: bash build.sh
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: POETRY_VERSION
        value: 1.8.2
    autoDeploy: true
    healthCheckPath: /
